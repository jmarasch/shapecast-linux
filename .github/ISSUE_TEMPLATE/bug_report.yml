name: Installation or runtime problem
description: Report a reproducible problem with the Linux helper.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        This is an unofficial experimental helper. Fresh activation and the complete new-owner workflow still need community validation.
        Do not include licence keys, request codes, order details, or launch URLs containing tokens. Review logs before attaching them.
  - type: input
    id: environment
    attributes:
      label: Linux and hardware
      description: Distribution/version, GPU model, video memory and NVIDIA driver version.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Software versions
      description: Linux helper version or commit, and Shapecast version.
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Where does it fail?
      options:
        - Installation or prerequisites
        - Activation
        - Model packs
        - Native runtime setup
        - Image or model generation
        - Rigging or postprocessing
        - Interface or shortcuts
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps, expected result and actual result
      description: Include the exact error, with personal details and credentials removed.
    validations:
      required: true
